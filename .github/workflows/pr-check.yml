name: PR check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Same build as the deploy: fails on broken links, broken anchors and MDX errors.
      - name: Build website
        run: npm run build
